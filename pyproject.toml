[project]
name = "miniflux-mcp"
version = "0.1.0"
description = "A minimal, read-only MCP server for a single Miniflux instance"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
miniflux-mcp = "miniflux_mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
